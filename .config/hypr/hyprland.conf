# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Global Paths
$hypr = ~/.config/hypr
$hypr_scheme = $hypr/scheme
$hypr_vars = $hypr/variables
$hypr_plugin = $hypr/plugins
$hypr_hypr = $hypr/hyprland

# Plugins
exec-once = hyprpm reload -n

# Imports
source = $hypr/custom_device.conf
source = $hypr_scheme/*
source = $hypr_plugin/*
source = $hypr_vars/*
source = $hypr_hypr/*



# Resources
# https://wiki.hyprland.org/Configuring/Environment-variables/
# https://wiki.hyprland.org/Configuring/Variables/



