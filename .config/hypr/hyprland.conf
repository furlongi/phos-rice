# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Global Paths
$hypr = ~/.config/hypr
$hypr_scheme = $hypr/scheme
$hypr_binds = $hypr/binds
$hypr_plugin = $hypr/plugins
$hypr_hypr = $hypr/hyprland
$hypr_scripts = $hypr/scripts


# Startup
# https://wiki.hyprland.org/Configuring/Keywords/#executing
exec-once = sudo systemctl start NetworkManager.service
exec-once = nmcli agent secret
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1 &
exec-once = /usr/libexec/pam_kwallet_init
# exec-once = /usr/libexec/kf6/kiod6
exec-once = hyprpm reload -n
exec-once = hyprctl setcursor Adwaita 24
exec-once = ags run
exec-once = GDK_BACKEND=wayland
exec-once = hypridle
exec-once = hyprpaper
exec-once = sudo systemctl start docker

# Auto delete trash 30 days old
exec-once = trash-empty 30

# Forward bluetooth media commands to MPRIS
exec-once = mpris-proxy



# TODO: ??
# exec-once = nm-applet &
# exec-once = swww-daemon
# exec-once = systemctl --user start hyprpolkitagents // using kde instead


# Imports
source = $hypr/custom_device.conf
source = $hypr_plugin/*
source = $hypr_binds/*
source = $hypr_hypr/*



# Resources
# https://wiki.hyprland.org/Configuring/Environment-variables/
# https://wiki.hyprland.org/Configuring/Variables/
# https://wiki.hypr.land/Configuring/Keywords/



