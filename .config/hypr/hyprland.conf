#### Global Paths
$hypr = ~/.config/hypr
$hypr_c = $hypr/hyprland
$hypr_s = $hypr/scheme
$hypr_v = $hypr/variables

#### Plugins
plugin = /home/ivan/.local/lib/hyprland/libhy3.so

#### Variables (TODO: Change for other theming?)
exec = cp -L --no-preserve=mode --update=none $hypr_s/default.conf $hypr_s/current.conf
source = $hypr_s/current.conf

source = $hypr_v/applications.conf
source = $hypr_v/styling.conf

source = $hypr_v/keybinds.conf


#### Imports
source = $hypr/desktop_configs/main_pc.conf
# source = $hypr/desktop_configs/laptop.conf

source = $hypr_c/animations.conf
source = $hypr_c/decoration.conf
source = $hypr_c/env.conf
source = $hypr_c/execs.conf
source = $hypr_c/general.conf
source = $hypr_c/gestures.conf
source = $hypr_c/group.conf


# env = HYPRCURSOR_THEME,Adwaita
# env = XCURSOR_THEME,Adwaita
# exec-once = hyprctl setcursor Adwaita 24


$configDir = ~/.config/hypr

source = $configDir/permissions.conf

# .config/hypr/hyprland.conf
plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1

        enable_gesture = true # laptop touchpad
        gesture_fingers = 3  # 3 or 4
        gesture_distance = 300 # how far is the "max"
        gesture_positive = true # positive = swipe dgown. Negative = swipe up.
    }
}



