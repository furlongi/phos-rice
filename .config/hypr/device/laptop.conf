# Startup
exec-once = sudo systemctl enable tlp.service
exec-once = sudo systemctl enable tlp-pd.service
exec-once = libinput-gestures-setup start

# Plugins

# Appearance
# Do these even work?
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,12
env = HYPRCURSOR_THEME,Sweet-cursors
env = XCURSOR_THEME,Sweet-cursors

# Inputs
input {
    accel_profile = adaptive
}

cursor {
    default_monitor = DP-1
}

# Aesthetics
decoration {
    blur {
        # -- Defaults --
        enabled = false
    }
}

# Applications
$device_obsidian_path = /home/main/AppImages/obsidian.appimage
$device_godot_path = /home/main/Applications/AppImages/Godot_v4.6.1-stable_mono_linux.x86_64

$phosCli = /home/main/Dev/phos-rice/phoscli/bin/phoscli

# Workspace Switcher
$workspaceMode = -s

workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1


# Monitor Layout
# See https://wiki.hyprland.org/Configuring/Monitors/
# hyprctl monitors all

monitorv2 {
    output = eDP-1
    mode = 2880x1800@120.00
    scale = 2
    vrr = 1
}

# Default
monitor = ,preferred,auto,auto
