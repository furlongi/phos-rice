# https://wiki.hyprland.org/Configuring/Variables/#general

general {
    layout = hy3
    
    gaps_in = $windowGapsIn
    gaps_out = $windowGapsOut
    gaps_workspaces = $workspaceGaps
    border_size = $windowBorderSize

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types 
    # Example: rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = $activeWindowBorderColour
    col.inactive_border = $inactiveWindowBorderColour

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false # Allows `immediate` window rule to work

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    # Use Mod + Right Click instead
    resize_on_border = false
}

plugin {
    hy3 {
        node_collapse_policy = 1
        autotile {
            enable = true
        }
    }
}


# https://wiki.hyprland.org/Configuring/Dwindle-Layout/
dwindle {
	preserve_split = false
	smart_split = true
	smart_resizing = true

    pseudotile = true
}
