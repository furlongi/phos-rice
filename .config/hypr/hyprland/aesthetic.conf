# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    layout = hy3

    border_size = 3
    gaps_in = 5
    gaps_out = 10
    float_gaps = 10
    gaps_workspaces = 5

    # TODO - Dynamic color
    # https://wiki.hyprland.org/Configuring/Variables/#variable-types
    # Example: rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(75,75,75,0.8)
    col.active_border = rgb(79,47,102) rgb(80,145,169) 45deg
    col.nogroup_border = 0xffffaaff

    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    resize_corner = 0 # All corners can be resized

    no_focus_fallback =  false

    # https://wiki.hyprland.org/Configuring/Tearing/
    # Not needed for my use cases
    allow_tearing = false

    modal_parent_blocking = true
    locale = en_US

    snap {
        enabled = true
        window_gap = 40
        monitor_gap = 40

        border_overlap = true
        respect_gaps = true
    }
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 12
    rounding_power = 2.0

    # -- Defaults --
    active_opacity = 1
    inactive_opacity = 1
    fullscreen_opacity = 1

    dim_modal = true
    dim_inactive = false
    dim_strength = 0.5
    dim_special = 0.2
    dim_around = 0.4
    screen_shader =
    border_part_of_window = true

    blur {
        # -- Defaults --
        enabled = true
        size = 8
        passes = 1
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.0117
        contrast = 0.8916
        brightness = 0.8172
        vibrancy = 0.1696
        vibrancy_darkness = 0
        special = false
        popups = false
        popups_ignorealpha = 0.2
        input_methods = false
        input_methods_ignorealpha = 0.2
    }

    shadow {
        enabled = true
        range = 10
        render_power = 2
        sharp = false
        ignore_window = true
        # TODO: Maybe make this dynamic color
        # https://rgbacolorpicker.com/
        # https://rgbacolorpicker.com/rgba-to-hex
        color = 0xee1a1a1a
        # color_inactive = unset
        offset = 0 0
        scale = 1.0
    }
}

# https://wiki.hypr.land/Configuring/Animations/
animations {
    enabled = true
    workspace_wraparound = false

    # https://wiki.hypr.land/Configuring/Animations/#curves
    # https://www.cssportal.com/css-cubic-bezier-generator/
    # https://easings.net/
    
    # -- Curves --
    # x0, y0, x1, y1
    bezier = easeInOutBack, 0.68, -0.6, 0.32, 1.6
    bezier = easeOutCubic, 0.33, 1, 0.68, 1
    bezier = easeInCubic, 0.32, 0, 0.67, 0
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = bounce,  0.00, 1.59, 0.57, 0.69
    bezier = linear,0,0,1,1
    bezier = quick,0.15,0,0.1,1
    bezier = almostLinear,0.5, 1, 0.89, 1
    
    
    # -- Animations --
    # animation = NAME, ONOFF, SPEED, CURVE [,STYLE]
    animation = global, 1, 7, default
        animation = windows, 1, 4, easeOutCubic
            animation = windowsIn, 1, 2, emphasizedAccel, popin 30%
            animation = windowsOut, 1, 5, easeOutCubic, slide
            animation = windowsMove, 1, 7, emphasizedDecel
        animation = layers, 1, 4, easeOutCubic
            animation = layers, 1, 4, easeOutCubic
            animation = layersIn, 1, 4, easeOutCubic, fade
            animation = layersOut, 1, 1.5, linear, fade
        animation = fade, 1, 3, quick
            animation = fadeIn, 1, 3, emphasizedAccel
            animation = fadeOut, 1, 2.5, almostLinear
            animation = fadeDim, 1, 6, default
            animation = fadeLayers, 1, 5, default
                animation = fadeLayersIn, 1, 2, almostLinear
                animation = fadeLayersOut, 1, 2, almostLinear
            animation = fadePopups, 1, 4, easeOutCubic
            animation = fadeDpms, 1, 10, easeOutCubic
        animation = border, 1, 3, easeOutCubic
        animation = workspaces, 1, 2, almostLinear, fade
            animation = specialWorkspace, 1, 5, easeInOutBack, slidevert -30%
}

# https://wiki.hypr.land/Configuring/Variables/#quirks
quirks {
    prefer_hdr = 0
}
