# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    layout = hy3

    border_size = 3
    gaps_in = 5
    gaps_out = 10
    float_gaps = 10
    gaps_workspaces = 5

    # TODO - Dynamic color
    # //wiki.hyprland.org/Configuring/Variables/#variable-types
    # Example: rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba($onSurfaceVariant11)
    col.active_border = rgba($primarye6)
    col.nogroup_border = 0xffffaaff

    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    resize_corner = 0 # All corners can be resized

    no_focus_fallback =  false

    # https://wiki.hyprland.org/Configuring/Tearing/
    # Not needed for my use cases
    allow_tearing = false

    modal_parent_blocking = true
    locale = en_US

    snap {
        enabled = true
        window_gap = 40
        monitor_gap = 40

        border_overlap = true
        respect_gaps = true
    }
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 12
    rounding_power = 2.0

    # -- Defaults --
    active_opacity = 1
    inactive_opacity = 1
    fullscreen_opacity = 1

    dim_modal = true
    dim_inactive = false
    dim_strength = 0.5
    dim_special = 0.2
    dim_around = 0.4
    screen_shader =
    border_part_of_window = true

    blur {
        # -- Defaults --
        enabled = true
        size = 8
        passes = 1
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.0117
        contrast = 0.8916
        brightness = 0.8172
        vibrancy = 0.1696
        vibrancy_darkness = 0
        special = false
        popups = false
        popups_ignorealpha = 0.2
        input_methods = false
        input_methods_ignorealpha = 0.2
    }

    shadow {
        enabled = true
        range = 10
        render_power = 2
        sharp = false
        ignore_window = true
        # TODO: Maybe make this dynamic color
        # https://rgbacolorpicker.com/
        # https://rgbacolorpicker.com/rgba-to-hex
        color = 0xee1a1a1a
        # color_inactive = unset
        offset = 0 0
        scale = 1.0
    }
}

# https://wiki.hypr.land/Configuring/Animations/
animations {
    enabled = true
    workspace_wraparound = false # Todo: enable once workspace made?

    # https://wiki.hypr.land/Configuring/Animations/#curves
    # https://www.cssportal.com/css-cubic-bezier-generator/
    # x0, y0, x1, y1
    bezier = specialWorkSwitch, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = standard, 0.2, 0, 0, 1

    # -- Defaults --
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade


        # Animation configs
    # animation = layersIn, 1, 5, emphasizedDecel, slide
    # animation = layersOut, 1, 4, emphasizedAccel, slide
    # animation = fadeLayers, 1, 5, standard

    # animation = windowsIn, 1, 5, emphasizedDecel
    # animation = windowsOut, 1, 3, emphasizedAccel
    # animation = windowsMove, 1, 6, standard
    # animation = workspaces, 1, 5, standard

    # animation = specialWorkspace, 1, 4, specialWorkSwitch, slidefadevert 15%

    # animation = fade, 1, 6, standard
    # animation = fadeDim, 1, 6, standard
    # animation = border, 1, 6, standard
}

