# https://wiki.hypr.land/Configuring/Binds/
# https://wiki.hypr.land/Configuring/Dispatchers/
# dnf in wev
# For checking keys

$appMod = SUPER
$appModSh = SUPER_SHIFT
$commandMod = SUPER_CONTROL
$commandModSh = SUPER_CONTROL_SHIFT
$altMod = SUPER_ALT

$leftMouseKey = mouse:272
$rightMouseKey = mouse:273
$middleMouseKey = mouse:274

# -----------------------------------------------------
# Applications
# -----------------------------------------------------
bind = $appMod, Return, exec, $terminal
bind = $appMod, E, exec, $fileManager
bind = $appMod, B, exec, $browser
bind = $appModSh, B, exec, $browser_alt
bind = $appMod, C, exec, $vscode
bind = $appModSh, C, exec, $zed
bind = $appMod, O, exec, $obsidian
bind = $appMod, D, exec, $discord
bind = $appMod, P, exec, $blender
bind = $appMod, G, exec, $godot
bind = $appMod, R, exec, $intellij_rider
bind = $appModSh, R, exec, $intellij_rust
bind = $appMod, S, exec, $steam
bind = $appMod, V, exec, $winboat
bind = $appModSh, V, exec, $virtmachine


# -----------------------------------------------------
# Rice Apps
# -----------------------------------------------------
bind = $appMod, SPACE, exec, $menu
bind = $commandMod, N, exec, swaync-client -t

# -----------------------------------------------------
# Desktop
# -----------------------------------------------------
bind = $appMod, Q, killactive
bind = $appModSh, Q, forcekillactive
bindm = $appMod, $leftMouseKey, movewindow
bindm = $appMod, $rightMouseKey, resizewindow
bind = $commandMod, F, togglefloating
bind = $altMod, F, fullscreen, 0 toggle
bind = ALT, TAB, cyclenext
bind = ALT_SHIFT, TAB, cyclenext, prev

bind = $commandMod, C, exec, hyprctl reload

# -----------------------------------------------------
# Tiling / Layout
# -----------------------------------------------------
bind = $appMod, left, hy3:movefocus, l
bind = $appMod, right, hy3:movefocus, r
bind = $appMod, up, hy3:movefocus, u
bind = $appMod, down, hy3:movefocus, d

bind = $appModSh, left, hy3:movewindow, l
bind = $appModSh, right, hy3:movewindow, r
bind = $appModSh, up, hy3:movewindow, u
bind = $appModSh, down, hy3:movewindow, d

bindo = $appModSh, left, exec, $phosCli tiling l
bindo = $appModSh, right, exec, $phosCli tiling r

bind = $commandMod, P, pseudo

# Resizing
bind = $commandMod, R, submap, resize
submap = resize
binde = , right, resizeactive, 20 0
binde = , left, resizeactive, -20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20
bind = , escape, submap, reset
submap = reset

# -----------------------------------------------------
# Workspaces
# -----------------------------------------------------
bind = $commandMod, right, exec, $phosCli workspace r $workspaceMode
bind = $commandMod, left, exec, $phosCli workspace l $workspaceMode
bind = $commandModSh, right, exec, $phosCli workspace r -w $workspaceMode
bind = $commandModSh, left, exec, $phosCli workspace l -w $workspaceMode

# -----------------------------------------------------
# Scratchpad
# -----------------------------------------------------
# https://wiki.hypr.land/Configuring/Dispatchers/#special-workspace
bind = $appMod, 1, togglespecialworkspace, mainPad
bind = $appModSh, 1, movetoworkspace, special:mainPad
bind = $appMod, 2, togglespecialworkspace, sidePad
bind = $appModSh, 2, movetoworkspace, special:sidePad
bind = $appMod, 3, togglespecialworkspace, other
bind = $appModSh, 3, movetoworkspace, special:other

# -----------------------------------------------------
# Power
# -----------------------------------------------------
# bind = $commandMod, E, submap, power
# submap = power, reset
# bind = , E, exit,
# bind = , L, exec, hyprlockses
# bind = , S, exec, systemctl suspend
# bind = , R, exec, systemctl reboot
# bind = , Q, exec, systemctl poweroff
# bind = , escape, submap, reset
# submap = reset

bind = SUPER_ALT_SHIFT, E, exit,
bind = SUPER_ALT_SHIFT, L, exec, sleep 2 && hyprlockses
bind = SUPER_ALT_SHIFT, S, exec, loginctl lock-session;sleep 3;hyprctl dispatch dpms off;sleep 5;systemctl suspend
bind = SUPER_ALT_SHIFT, R, exec, sleep 2 && systemctl reboot
bind = SUPER_ALT_SHIFT, Q, exec, sleep 2 && systemctl poweroff

# -----------------------------------------------------
# Screenshots
# -----------------------------------------------------
bind = $appModSh, S, exec, slurp | grim -g- - | wl-copy

# -----------------------------------------------------
# Opensuse Yast GUI Fix
# ----------------------------------------------------
bind = $appModSh, Y, exec, kitty --hold -e bash -c "xhost +SI:localuser:root; sudo -E /sbin/yast2"

# -----------------------------------------------------
# Audio / Multimedia
# -----------------------------------------------------
# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl position 5+
bindol = , XF86AudioNext, exec, playerctl next
bindol = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPrev, exec, playerctl position 5-

bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-



#-------------------------------------------------------


