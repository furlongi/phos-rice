# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
general {
    # lock_cmd = hyprlock
    before_sleep_cmd = loginctl lock-session;sleep 3;hyprctl dispatch dpms off;sleep 5
    after_sleep_cmd = sleep 3;hyprctl dispatch dpms on;sleep 5
}

listener {
    timeout = 600 # 10 minutes
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200 # 20 minutes
    on-timeout = hyprctl dispatch dpms off;sleep 10
    # on-resume = hyprctl dispatch dpms on;sleep 5
}