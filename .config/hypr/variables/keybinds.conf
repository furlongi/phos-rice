$appMod = SUPER
$appModSh = SUPER_SHIFT
$commandMod = SUPER_CONTROL
$altMod = SUPER_ALT

$mainMod = SUPER
$mainModSh = SUPER_SHIFT
$commModSh = SUPER_CONTROL_SHIFT

$leftMouseKey = mouse:272
$rightMouseKey = mouse:273

# -----------------------------------------------------
# Applications
# -----------------------------------------------------
# Application Binds
bind = $appMod, Return, exec, $terminal
bind = $appMod, O, exec, $obsidian
bind = $appMod, E, exec, $fileManager
bind = $appMod, D, exec, $discord
bind = $appMod, B, exec, $browser
bind = $appModSh, B, exec, $browser_alt
bind = $appMod, V, exec, $vscode

# Application Command Binds
bind = $appMod, SPACE, exec, $menu
bind = $appMod, Q, killactive,

bindm = $appMod, $leftMouseKey, movewindow
bindm = $appMod, $rightMouseKey, resizewindow


# -----------------------------------------------------
# Desktop
# -----------------------------------------------------
bind = $commandMod, N, exec, swaync-client -t
bind = $commandMod, F, togglefloating
bind = $commandMod, P, pseudo, # dwindle
bind = $commandMod, S, togglesplit, # dwindle

bind = $mainMod, left, hy3:movefocus, l
bind = $mainMod, right, hy3:movefocus, r
bind = $mainMod, up, hy3:movefocus, u
bind = $mainMod, down, hy3:movefocus, d

bind = $mainModSh, left, hy3:movewindow, l
bind = $mainModSh, right, hy3:movewindow, r
bind = $mainModSh, up, hy3:movewindow, u
bind = $mainModSh, down, hy3:movewindow, d


# TODO: Fix with my workspace script
bind = $commandMod, right, workspace, +1
bind = $commandMod, left, workspace, -1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
binde = $commModSh, right, movetoworkspace, +1
binde = $commModSh, left, movetoworkspace, -1


# Example special workspace (scratchpad)
bind = $commandMod, Z, togglespecialworkspace, magic
bind = $commModSh, Z, movetoworkspace, special:magic


# bind = $desktopMod, R, exec, $wallpaperChange


# -----------------------------------------------------
# Power
# -----------------------------------------------------

#Logout
# bind = $mainMod, M, exit,


# -----------------------------------------------------
# Audio / Multimedia
# -----------------------------------------------------
# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-


# -----------------------------------------------------
# Laptop / Touchpad
# -----------------------------------------------------
$touchpadScrollFactor = 0.3
$workspaceSwipeFingers = 4
$gestureFingers = 3
$gestureFingersMore = 4



