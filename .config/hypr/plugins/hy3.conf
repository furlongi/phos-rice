plugin {
    hy3 {
        # https://github.com/outfoxxed/hy3?tab=readme-ov-file#config-fields
        tab_first_window = false

        node_collapse_policy = 1
        autotile {
            enable = true
            ephemeral_groups = false
            trigger_width = 0
            trigger_height = 0
            workspaces = all
        }

        # -- Defaults --
        no_gaps_when_only = 0
        node_collapse_policy = 2
        group_inset = 10
        tabs {
        }
    }
}