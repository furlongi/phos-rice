include ~/.cache/wal/colors-kitty.conf

# ctrl shift f5

# BEGIN_KITTY_FONTS
font_family      family='DejaVu Sans Mono' postscript_name=DejaVuSansMono features='liga rtbd'
bold_font        auto
italic_font      family='DejaVu Sans Mono' postscript_name=DejaVuSansMono-Oblique
bold_italic_font auto
# END_KITTY_FONTS

# Needed for opacity
linux_display_server X11
background_opacity 0.77

font_size 11.5

shell /bin/fish

cursor_text_color #111111
shell_integration no-cursor
cursor_shape beam
cursor_shape_unfocused hollow

cursor_blink_interval 0.5
cursor_trail 10
cursor_trail_color #a8a1a1


scrollback_lines 10000
scrollbar scrolled


# Disables mouse visibility
mouse_hide_wait	-1


# Remote control
allow_remote_control yes
remote_control_password "" *-colors