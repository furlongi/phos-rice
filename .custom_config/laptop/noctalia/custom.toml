[dock]
monitors = [ "eDP-1" ]


[idle.behavior.lock]
timeout = 300.0


[idle.behavior.lock-and-suspend]
timeout = 420.0


[idle.behavior.screen-off]
timeout = 400.0


[notification]
monitors = [ "eDP-1" ]


[osd]
monitors = [ "eDP-1" ]


## Wallpapers ##
[wallpaper]
directory = "/home/main/Pictures/wallpaper"


## Bars ##
[bar.main-bar]
font_scale = 1.20
padding = 15
scale = 1.00
thickness = 27

[bar.second-bar]
font_scale = 1.20
padding = 15
scale = 1.00
thickness = 27


## Lockscreen ##

[lockscreen]
wallpaper = "/home/main/Pictures/desktop/chrono-cross-forest.png"

[lockscreen_widgets]
widget_order = [
    "lockscreen-widget-0000000000000005",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004",
    "lockscreen-widget-0000000000000006",
    "lockscreen-widget-0000000000000007",
    "lockscreen-widget-0000000000000008"
]

