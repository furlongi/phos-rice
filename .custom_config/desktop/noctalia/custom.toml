
[dock]
monitors = [ "DP-1" ]


[idle.behavior.lock]
timeout = 600.0


[idle.behavior.lock-and-suspend]
timeout = 960.0


[idle.behavior.screen-off]
timeout = 900.0


[notification]
monitors = [ "DP-1" ]


[osd]
monitors = [ "DP-1" ]

## Bars ##
[bar.main-bar]
font_scale = 1.29
padding = 20
scale = 1.05
thickness = 35

[bar.second-bar]
font_scale = 1.29
padding = 20
scale = 1.05
thickness = 35


## Wallpapers ##
[wallpaper]
directory = "/home/main/Pictures/wallpaper"

    [wallpaper.default]
    path = "/home/main/Pictures/wallpaper/xb2_landscape_wide_4096x1707.jpg"

    [wallpaper.last]
    path = "/home/main/Pictures/wallpaper/xb2_landscape_wide_4096x1707.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/main/Pictures/wallpaper/xb2_landscape_wide_4096x1707.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/main/Pictures/wallpaper/xb2_landscape_wide_4096x1707.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/main/Pictures/wallpaper/xb2_landscape_wide_4096x1707.jpg"

    [[wallpaper.favorite]]
    builtin_palette = "Noctalia"
    palette_source = "wallpaper"
    path = "/home/main/Pictures/wallpaper/xb2_landscape_wide_4096x1707.jpg"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    builtin_palette = "Noctalia"
    palette_source = "wallpaper"
    path = "/home/main/Pictures/wallpaper/ghost_in_shell_3840x2160.png"
    theme_mode = "dark"



