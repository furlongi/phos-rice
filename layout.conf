#####################
###  Appearance   ###
#####################
env = XCURSOR_SIZE,12
env = HYPRCURSOR_SIZE,12



###################
###  Monitors   ###
###################

# See https://wiki.hyprland.org/Configuring/Monitors/
# hyprctl monitors all

# Main LG Monitor
monitor=DP-1, 3440x1440@144, 0x0, 1

# MSI Vertical Right
monitor=DP-2, 2560x1440@165, 3440x-600, 1, transform, 3

# Spare Asus on Left
monitor=DP-3, 1920x1080@144.00, -1920x400, 1

# Drawing Pad
## When on Left
monitor=HDMI-A-1, 1920x1080@60.00, -3840x400, 1

# Default
monitor=,preferred,auto,auto